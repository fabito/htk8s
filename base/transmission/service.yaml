apiVersion: v1
kind: Service
metadata:
  name: transmission
spec:
  # k3s ServiceLB exposes these ports on the node, not just inside the cluster.
  # Forward ONLY peer port 51413 from the router; never forward the Web UI/RPC.
  type: LoadBalancer
  ports:
  - port: 9091
    protocol: TCP
    targetPort: 9091
    name: webui
  - port: 51413
    protocol: TCP
    targetPort: 51413
    name: peer-tcp
  - port: 51413
    protocol: UDP
    targetPort: 51413
    name: peer-udp
  selector:
    run: transmission
